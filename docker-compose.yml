services:
  mysql:
    image: mysql:8.0
    container_name: helloworld-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: helloworld
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helloworld-redis
    restart: unless-stopped
    # AOF 지속화: 쓰기를 append-only 로그로 디스크에 기록(everysec=크래시 시 최대 ~1초분만 유실).
    # RDB 스냅샷도 기본 유지 → 재시작 시 AOF로 복원. 팔로우/좋아요 정본(Redis)이 재생성/크래시에도 살아남는다.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data   # 컨테이너 재생성(compose up --build)에도 AOF/RDB 파일 보존
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 팔로우 RDB 비동기 반영용 SQS 브로커(무료, SQS 호환). 내부 네트워크 전용(호스트 포트 미공개).
  # 인메모리라 재시작 시 미소비 메시지는 유실될 수 있음(경미). 완전 내구성은 실 AWS SQS 필요.
  elasticmq:
    image: softwaremill/elasticmq-native
    container_name: helloworld-elasticmq
    restart: unless-stopped
    # 큐를 정적 선언한 설정을 마운트 → 브로커(인메모리) 재시작에도 큐가 되살아나 파이프라인 자동 복구.
    # (미마운트 시: 재시작하면 큐 소실 → QueueDoesNotExistException으로 백엔드 재시작 전까지 백업 정지)
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    # SQS API 포트(9324)가 실제로 열린 뒤에만 backend가 기동하도록 readiness 체크.
    # native 이미지에도 busybox nc가 있어 TCP 체크가 가능하다(HTTP GET은 SQS 쿼리 API라 부적합).
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9324"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 파일 저장(MinIO). 프로필 사진·게시물 이미지가 여기에 들어간다.
  #
  # compose로 관리하는 이유: 전에는 서버에서 docker run 으로 따로 띄워 두었는데
  #  - 백엔드와 다른 네트워크에 있어 `minio:9000` 이름 해석이 실패했고
  #  - 자격증명이 설정되지 않아 기본값(minioadmin/minioadmin)으로 인터넷에 열려 있었고
  #  - 로컬 개발자는 각자 docker run 명령을 찾아 실행해야 했다.
  # 같은 compose 안에 두면 이름으로 통신되고, 설정이 한곳에 남고, 로컬도 그냥 뜬다.
  #
  # 포트를 127.0.0.1에 묶는 이유: 관리 콘솔(9001)이 인터넷에 열리면 자격증명 대입 표적이 된다.
  # 배포에서 이미지 조회는 nginx가 127.0.0.1:9000으로 프록시하므로 외부 공개가 필요 없다.
  # 콘솔은 SSH 터널로 접근한다: ssh -L 9001:127.0.0.1:9001 ...
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: helloworld-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/helloworld?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # 팔로우 1회성 백필 스위치(기본 false). 백필 실행 때만 서버 .env에서 true로 주입 후
      # `docker compose up -d backend`로 재생성, 완료(로그 [follow-backfill] 완료) 뒤 false로 되돌려 재생성.
      APP_FOLLOW_BACKFILL_ENABLED: ${APP_FOLLOW_BACKFILL_ENABLED:-false}
      # AWS SQS 사용 시 채우기 (안 쓰면 비워둬도 무방)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # 소셜 로그인(구글). 값은 루트 .env 에서 주입 (커밋 금지)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      # GitHub 연동(잔디). 값은 루트 .env 에서 주입 (커밋 금지)
      # GITHUB_TOKEN_ENC_KEY 는 저장된 access token 복호화에 쓰인다 —
      # 값이 바뀌면 기존 연동이 전부 무효가 되므로 환경별로 고정해 둘 것.
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN_ENC_KEY: ${GITHUB_TOKEN_ENC_KEY:-}
      # OAuth App에 등록한 콜백 URL과 정확히 일치해야 한다(불일치 시 GitHub이 인가를 거절).
      OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI:-https://i15e204.p.ssafy.io/api/github/callback}
      # 연동 후 돌아갈 프론트 주소. 뒤에 /users/{userId} 가 붙는다.
      # (비밀번호 재설정 메일 링크의 앞부분에도 재사용된다: {APP_FRONT_BASE_URL}/reset?token=...)
      APP_FRONT_BASE_URL: ${APP_FRONT_BASE_URL:-https://i15e204.p.ssafy.io}
      # 비밀번호 재설정 메일(Gmail SMTP). 실제 값은 서버 .env 에서 주입(커밋 금지).
      # MAIL_ENABLED=true 로 켤 때만 실제 발송(그 전엔 로그 출력). 켜면 USERNAME/APP_PASSWORD 필수.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      # 잔디 동기화 배치(매일 03:00). 인스턴스를 여러 대로 늘리면 한 대만 true로 둔다.
      APP_GITHUB_SYNC_ENABLED: ${APP_GITHUB_SYNC_ENABLED:-true}
      # 팔로우 RDB 비동기 반영 (SQS via ElasticMQ). 큐는 앱이 자동 생성.
      # 자격증명은 ElasticMQ용 더미(test/test) — 실 AWS 아님. 실 SQS 전환 시 값·endpoint 교체.
      APP_SQS_ENABLED: "true"
      APP_SQS_FOLLOW_QUEUE: helloworld-follow-events
      # 게시물 좋아요 RDB 반영. 팔로우와 스위치가 분리돼 있다 — 한쪽을 켠다고 다른 쪽이 켜지지 않는다.
      #  - false(기본): 좋아요 토글이 RDB를 동기로 반영한다. 기능은 정상 동작한다.
      #  - true: 큐(helloworld-post-like-events)가 존재하는 환경에서만 켠다.
      #    ElasticMQ에는 infra/elasticmq/elasticmq.conf 로 미리 선언돼 있어 로컬 검증이 가능하다.
      #    운영은 큐 생성 권한이 없어(sqs:CreateQueue 403) 큐를 먼저 만든 뒤에만 켤 것.
      APP_SQS_POST_LIKE_ENABLED: ${APP_SQS_POST_LIKE_ENABLED:-false}
      APP_SQS_POST_LIKE_QUEUE: helloworld-post-like-events
      # 좋아요 RDB 재동기화 러너(1회성). Redis 정본 기준으로 post_likes/like_count를 복구한다.
      # 복구가 필요할 때만 서버 .env에서 true로 주입 후 `docker compose up -d backend`,
      # 로그 [post-like-resync] 완료 확인 뒤 false로 되돌려 재생성한다.
      APP_POST_LIKE_RESYNC_ENABLED: ${APP_POST_LIKE_RESYNC_ENABLED:-false}
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://elasticmq:9324
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      # 파일 업로드(MinIO). 자격증명은 서버 .env 에서 주입 (커밋 금지)
      #
      # MINIO_PUBLIC_BASE_URL 은 반드시 nginx 경로(/files)여야 한다.
      # MinIO 주소(:9000)를 그대로 내려주면 ① HTTPS가 아니라 브라우저가 혼합 콘텐츠로 차단하고
      # ② 지금은 127.0.0.1 바인딩이라 외부에서 아예 접근되지 않는다.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: helloworld
      # 기본값은 로컬용. 배포 서버는 .env 에서 https://i15e204.p.ssafy.io/files 로 덮어쓴다.
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/helloworld}
      # 프로젝트 요약(GitHub README → OpenAI). 값은 서버 .env 에서 주입 (커밋 금지)
      # OPENAI_API_KEY 가 비어 있으면 요약 단계를 건너뛴다 — 게시물 작성은 정상 동작한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      # 저장소 조회용 서버 토큰. 없으면 익명이라 시간당 60회 제한에 걸린다.
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: helloworld-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  mysql_data:
  redis_data:
  minio_data:
