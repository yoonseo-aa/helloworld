server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 브라우저는 <link rel="icon">과 **별개로** /favicon.ico를 관례적으로 찔러본다.
    # 아래 try_files 폴백에 걸리면 없는 파일인데도 index.html이 200 text/html로 나가고,
    # 브라우저는 그 HTML을 아이콘으로 읽으려다 실패해 "깨진 아이콘"을 캐시에 남긴다.
    # 없으면 없다고 답해야 선언한 /favicon.svg로 정상 폴백한다.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 404;
    }

    # React Router 등 클라이언트 라우팅 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시. proxy_pass 뒤에 경로(끝 슬래시)를 붙이면 /api/ 접두어가
    # 잘린 채 전달된다 — 백엔드 컨트롤러는 /api/... 로 매핑돼 있으므로 경로를 그대로 넘긴다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
