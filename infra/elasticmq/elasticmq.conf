# ElasticMQ 설정 (배포 SQS 브로커).
# 목적: 큐를 "정적으로 선언"해 브로커가 재시작돼도 큐가 되살아나게 한다.
#
# 왜? ElasticMQ는 인메모리라 재시작하면 앱이 기동 시 자동 생성했던 큐가 사라진다.
# 그러면 백엔드가 없는 큐로 발행/폴링해 QueueDoesNotExistException으로 백업 파이프라인이
# 백엔드 재시작 전까지 조용히 멈춘다. 여기서 큐를 미리 선언해두면 브로커 재시작 후에도
# 큐가 존재해 파이프라인이 자동 복구된다(인플라이트 미소비 메시지만 유실).
#
# 마운트: docker-compose에서 이 파일을 /opt/elasticmq.conf 로 마운트(이미지 기본 설정 경로).

include classpath("application.conf")

node-address {
    protocol = http
    host = localhost
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"   # 다른 컨테이너(backend)에서 접속 가능하도록 전체 인터페이스 바인딩
    sqs-limits = strict
}

# 앱이 쓰는 큐를 미리 선언(브로커 재시작에도 유지).
# - helloworld-follow-events : 팔로우 RDB 비동기 반영
# - comment-like-events      : 댓글 좋아요 RDB 비동기 반영(feature/be-comment 머지 후 활성)
#
# DLQ(dead-letter queue) + maxReceiveCount:
#   깨진 JSON이나 FK 위반(예: 발행~소비 사이 대상 유저 삭제) 같은 "poison" 메시지는
#   처리 시마다 실패→재전달을 무한 반복해 로그 스팸/워커 낭비를 유발한다.
#   maxReceiveCount회 연속 실패하면 원본 대신 *-dlq 큐로 옮겨 루프를 끊는다.
#   (일시 장애(예: MySQL 순단)는 그 안에 복구되면 정상 처리되고, 넘어가면 DLQ로 격리 → 나중에 수동 점검)
#   defaultVisibilityTimeout으로 재시도 간격을 벌려 일시 장애가 조기 DLQ되는 것을 완화.
queues {
    "helloworld-follow-events" {
        defaultVisibilityTimeout = 30 seconds
        deadLettersQueue {
            name = "helloworld-follow-events-dlq"
            maxReceiveCount = 5
        }
    }
    "helloworld-follow-events-dlq" { }

    "comment-like-events" {
        defaultVisibilityTimeout = 30 seconds
        deadLettersQueue {
            name = "comment-like-events-dlq"
            maxReceiveCount = 5
        }
    }
    "comment-like-events-dlq" { }
}
